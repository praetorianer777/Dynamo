apiVersion: v2
name: dynamo
description: Stator, Armature and Exciter at the versions Dynamo tested together, connected to each other.
type: application
# The suite's release (YYYY.MM.N once #3 tags them); appVersion is the
# dynamo-connect image's tag.
version: 0.1.2
