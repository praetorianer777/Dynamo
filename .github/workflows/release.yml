# A tag vX.Y.Z publishes what an install of the suite needs from Dynamo: the
# dynamo-connect image and the umbrella chart, at the version Chart.yaml says.
name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: The tag is the chart's version and appVersion
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart=$(sed -n 's/^version: *//p' deploy/charts/dynamo/Chart.yaml)
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' deploy/charts/dynamo/Chart.yaml)
          if [[ "$chart" != "$version" || "$app" != "$version" ]]; then
            echo "::error::The tag says $version, but Chart.yaml has version $chart and appVersion $app; set both to $version and tag again."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  connect:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: connect
          push: true
          tags: ghcr.io/praetorianer777/dynamo-connect:${{ needs.resolve.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  chart:
    needs: [resolve, connect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Package the chart
        run: make chart-package
      - name: Push the chart
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: make chart-push
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          {
            echo "Stator, Armature and Exciter at the versions in versions.yaml, with the one Kroki that draws their diagrams, installed and connected by one chart:"
            echo
            sed 's/^/- /' versions.yaml | grep -v '^- #'
            echo
            echo "Tested as an upgrade of a running installation, with Docker Compose and with helm upgrade, from:"
            echo
            sed 's/^/- /' versions-upgrade-from.yaml | grep -v '^- #'
            echo
            echo '```sh'
            echo "helm install dynamo oci://ghcr.io/praetorianer777/charts/dynamo --version $VERSION -n dynamo --create-namespace -f values.yaml"
            echo "helm test dynamo -n dynamo --logs"
            echo '```'
            echo
            echo "docs/deploying.md says what values.yaml needs. On one machine without Kubernetes, docs/deploying-compose.md runs the same with Docker Compose."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "dist/dynamo-$VERSION.tgz"
