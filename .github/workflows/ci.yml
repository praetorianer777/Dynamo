name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./run-tests.sh shell check-format check-go

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # Until every pinned version is released there is nothing to pull, so
      # the images are built from the tools' main branches instead, and the
      # job says it tested those rather than the pins.
      - id: pins
        run: |
          missing=""
          for image in $(make -s compose-config ARGS=--images | grep -v '^dynamo-connect' | sort -u); do
            docker manifest inspect "$image" >/dev/null 2>&1 || missing="$missing $image"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Stack tested against the tools' main branches::These pinned images are not published yet, so they were built from source:$missing"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pins.outputs.available == 'false'
        run: scripts/free-runner-disk.sh && scripts/images-from-source.sh
      - run: ./run-tests.sh test-stack

  # The suite as a server runs it: docker compose up from the settings
  # template, over HTTPS, in production mode.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - id: pins
        run: |
          missing=""
          for image in $(make -s compose-config ARGS=--images | grep -v '^dynamo-connect' | sort -u); do
            docker manifest inspect "$image" >/dev/null 2>&1 || missing="$missing $image"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Server tested against the tools' main branches::These pinned images are not published yet, so they were built from source:$missing"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pins.outputs.available == 'false'
        run: scripts/free-runner-disk.sh && scripts/images-from-source.sh
      - run: ./run-tests.sh test-server

  # An installation of versions-upgrade-from.yaml, with people and content,
  # upgraded to the pins as an operator would; the pinned images come from
  # source as in the stack job, the previous ones are always released.
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - id: pins
        run: |
          missing=""
          for image in $(make -s compose-config ARGS=--images | grep -v '^dynamo-connect' | sort -u); do
            docker manifest inspect "$image" >/dev/null 2>&1 || missing="$missing $image"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Upgraded to the tools' main branches::These pinned images are not published yet, so they were built from source:$missing"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # Two combinations of images do not fit beside each other otherwise.
      - run: scripts/free-runner-disk.sh
      - if: steps.pins.outputs.available == 'false'
        run: scripts/images-from-source.sh
      - run: ./run-tests.sh test-upgrade

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Once with every secret a value, once with every secret a Secret made
    # before the install.
    strategy:
      fail-fast: false
      matrix:
        secrets: [values, existing]
    name: chart (${{ matrix.secrets }} secrets)
    env:
      DYNAMO_EXISTING_SECRETS: ${{ matrix.secrets == 'existing' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      # The same as the stack job, and the tools' charts come from source too.
      - id: pins
        run: |
          missing=""
          for image in $(make -s compose-config ARGS=--images | grep -v '^dynamo-connect' | sort -u); do
            docker manifest inspect "$image" >/dev/null 2>&1 || missing="$missing $image"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Chart tested against the tools' main branches::These pinned images are not published yet, so they and the tools' charts were built from source:$missing"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pins.outputs.available == 'false'
        run: |
          scripts/free-runner-disk.sh && scripts/images-from-source.sh
          echo "DYNAMO_CHARTS_FROM_SOURCE=1" >> "$GITHUB_ENV"
      - run: ./run-tests.sh test-chart

  # The chart installed from the tools' charts at versions-upgrade-from.yaml,
  # packaged from their tags since they were never published, given people
  # and content, and taken to this chart with helm upgrade; the pinned images
  # and charts come from source as in the chart job.
  chart-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: pins
        run: |
          missing=""
          for image in $(make -s compose-config ARGS=--images | grep -v '^dynamo-connect' | sort -u); do
            docker manifest inspect "$image" >/dev/null 2>&1 || missing="$missing $image"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Chart upgraded to the tools' main branches::These pinned images are not published yet, so they and the tools' charts were built from source:$missing"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # Two combinations of images do not fit beside each other otherwise.
      - run: scripts/free-runner-disk.sh
      - if: steps.pins.outputs.available == 'false'
        run: |
          scripts/images-from-source.sh
          echo "DYNAMO_CHARTS_FROM_SOURCE=1" >> "$GITHUB_ENV"
      - run: ./run-tests.sh test-chart-upgrade
